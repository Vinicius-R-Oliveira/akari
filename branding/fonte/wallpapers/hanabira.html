<!doctype html>
<html><head><meta charset="utf-8">
<!-- Akari · 花びら Hanabira — chuva de pétalas -->
<style>
  @font-face{font-family:"Fraktur";src:url("../fonts/UnifrakturCook-Bold.woff2");font-weight:700}
  html,body{margin:0;width:3840px;height:2160px;background:#050505;overflow:hidden}
  .layer{position:absolute;inset:0}
  #big{position:absolute;left:-180px;top:180px;font-family:"Noto Serif CJK JP";font-weight:900;font-size:1900px;line-height:1;
       color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.28)}
  #flower{position:absolute;left:2380px;top:560px;width:900px;height:900px}
  #flower .ol{stroke-width:2.6} #flower .bl{stroke-width:3.2}
  #word{position:absolute;right:300px;bottom:250px;font-family:"Fraktur";font-weight:700;font-size:200px;color:#ececec}
  #haiku{position:absolute;right:310px;bottom:200px;font-family:"Noto Serif CJK JP";font-weight:300;font-size:30px;letter-spacing:.4em;color:rgba(255,255,255,.5)}
  .vert{position:absolute;writing-mode:vertical-rl;font-family:"Noto Serif CJK JP";color:rgba(255,255,255,.42);letter-spacing:.5em}
</style></head>
<body>
<svg class="layer" width="3840" height="2160">
  <defs><radialGradient id="aura" cx="72%" cy="48%" r="34%"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="3840" height="2160" fill="url(#aura)"/>
  <rect x="120" y="96" width="3600" height="1968" rx="40" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="3" stroke-dasharray="26 18"/>
</svg>
<div id="big">灯</div>
<svg id="petals" class="layer" width="3840" height="2160"></svg>
<!--FLOR-->
<div id="word">akari</div>
<div id="haiku">花びらに　灯りをともす　夜の風</div>
<div class="vert" style="left:260px;top:260px;font-size:30px">散る花の光</div>
<svg class="layer" width="3840" height="2160" style="mix-blend-mode:screen;opacity:.09">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="3840" height="2160" filter="url(#n)"/>
</svg>
<svg class="layer" width="3840" height="2160"><defs><radialGradient id="vig" cx="55%" cy="50%" r="78%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient></defs><rect width="3840" height="2160" fill="url(#vig)"/></svg>
<script>
  let s = 99; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const P = "M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z";
  let h = '<defs><filter id="b1"><feGaussianBlur stdDeviation="2.5"/></filter><filter id="b2"><feGaussianBlur stdDeviation="9"/></filter></defs>';
  for (let i = 0; i < 120; i++) {
    // pétalas soprando da direita para a esquerda, mais densas perto da flor
    const t = r(), x = 3700 - Math.pow(t, .8) * 3500 + (r() - .5) * 300, y = 1010 + (r() - .5) * 1700 * (0.35 + t);
    if (Math.hypot(x - 2830, y - 1010) < 470) continue;
    const d = r(), sc = .25 + d * .7, op = .08 + d * .55, f = d < .35 ? 'filter="url(#b2)"' : d < .65 ? 'filter="url(#b1)"' : '';
    h += `<path d="${P}" transform="translate(${x|0} ${y|0}) rotate(${(200 + r()*140)|0}) scale(${sc.toFixed(2)} ${(sc*(.45+r()*.5)).toFixed(2)})" fill="#fff" fill-opacity="${(op*.35).toFixed(2)}" stroke="#fff" stroke-opacity="${op.toFixed(2)}" stroke-width="3" ${f}/>`;
  }
  document.getElementById("petals").innerHTML = h;
</script>
</body></html>
