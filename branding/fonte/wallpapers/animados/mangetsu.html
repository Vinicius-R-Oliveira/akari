<!doctype html>
<html><head><meta charset="utf-8">
<!-- Akari · 満月 Mangetsu — lua cheia, nuvens passando e um galho na frente (vídeo em loop) -->
<style>
  @font-face{font-family:"Fraktur";src:url("../../fonts/UnifrakturCook-Bold.woff2");font-weight:700}
  html,body{margin:0;width:1920px;height:1080px;background:#030304;overflow:hidden}
  .layer{position:absolute;inset:0}
  #halo{position:absolute;left:740px;top:-170px;width:1200px;height:1200px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.22) 0%,rgba(255,255,255,.10) 30%,rgba(255,255,255,.03) 50%,rgba(255,255,255,0) 70%);
        animation:luz 8s ease-in-out infinite}
  @keyframes luz{0%,100%{opacity:.75}50%{opacity:1}}
  #lua{position:absolute;left:1060px;top:150px;width:560px;height:560px;border-radius:50%;
       background:radial-gradient(circle at 42% 38%,#fbfbfb 0%,#e9e9e9 45%,#cfcfcf 75%,#b9b9b9 100%)}
  #crateras{position:absolute;left:1060px;top:150px;width:560px;height:560px;border-radius:50%;overflow:hidden;opacity:.5;mix-blend-mode:multiply}
  .nuvens{position:absolute;left:0;width:3840px;height:700px;animation:vento linear infinite}
  @keyframes vento{from{transform:translateX(-1920px)}to{transform:translateX(0)}}
  #kanji{position:absolute;left:190px;top:150px;writing-mode:vertical-rl;font-family:"Noto Serif CJK JP";font-weight:300;font-size:120px;
         letter-spacing:.4em;color:rgba(255,255,255,.82);text-shadow:0 0 30px rgba(255,255,255,.2)}
  #kanji2{position:absolute;left:350px;top:160px;writing-mode:vertical-rl;font-family:"Noto Serif CJK JP";font-size:22px;letter-spacing:.6em;color:rgba(255,255,255,.35)}
  #word{position:absolute;left:180px;bottom:140px;font-family:"Fraktur";font-weight:700;font-size:110px;color:#f2f2f2}
  #flower{position:absolute;left:1600px;top:760px;width:200px;height:200px}
  #flower .corehalo{animation:respira 4s ease-in-out infinite}
</style>
<script src="comum.js"></script>
</head>
<body>
<svg class="layer" width="1920" height="1080"><rect x="60" y="48" width="1800" height="984" rx="20" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="13 9"/></svg>
<div id="halo"></div>
<div id="lua"></div>
<svg id="crateras" width="560" height="560"><filter id="t"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 1"/></feComponentTransfer></filter><rect width="560" height="560" filter="url(#t)"/></svg>
<div id="nuvens" class="layer"></div>
<svg id="galho" class="layer" width="1920" height="1080"></svg>
<div id="kanji">満月</div>
<div id="kanji2">月の光に　花が咲く</div>
<div id="word">akari</div>
<!--FLOR-->
<svg class="layer" width="1920" height="1080" style="mix-blend-mode:screen;opacity:.07">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="1920" height="1080" filter="url(#n)"/>
</svg>
<svg class="layer" width="1920" height="1080"><defs><radialGradient id="vig" cx="65%" cy="38%" r="80%"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#vig)"/></svg>
<script>
  const r = semente(41);
  // Nuvens: faixas que se repetem a cada 1920px, então o loop fecha certinho
  const camadas = [
    { top: 20, dur: LOOP, op: .16, blur: 26 },
    { top: 230, dur: LOOP, op: .10, blur: 40 },
    { top: -120, dur: LOOP, op: .08, blur: 50 },
  ];
  let html = "";
  for (const cam of camadas) {
    let blobs = "";
    for (let rep = 0; rep < 2; rep++) {
      const rr = semente(cam.top);
      for (let i = 0; i < 7; i++) {
        const x = rep * 1920 + rr() * 1920, y = 300 + rr() * 100, w = 260 + rr() * 420, h = 50 + rr() * 70;
        blobs += `<ellipse cx="${x}" cy="${y}" rx="${w / 2}" ry="${h / 2}" fill="#fff"/>`;
      }
    }
    html += `<svg class="nuvens" style="top:${cam.top}px;opacity:${cam.op};animation-duration:${cam.dur}s;filter:blur(${cam.blur}px)" width="3840" height="700">${blobs}</svg>`;
  }
  document.getElementById("nuvens").innerHTML = html;
  // Galho escuro na frente da lua
  const galho = [
    "M-20 520 C200 470 420 430 700 420 C900 412 1060 380 1240 300 C1330 262 1420 250 1500 262",
    "M700 420 C760 360 840 330 930 330", "M1060 370 C1120 420 1200 450 1290 450", "M300 480 C340 420 400 390 460 380",
  ];
  let g = "";
  galho.forEach((d, i) => g += `<path d="${d}" fill="none" stroke="#050505" stroke-width="${[20, 10, 9, 8][i]}" stroke-linecap="round"/>`);
  for (let i = 0; i < 26; i++) {
    const t = r();
    const x = 120 + t * 1360 + (r() - 0.5) * 60, y = 500 - t * 230 + (r() - 0.5) * 70;
    const s = 0.14 + r() * 0.12;
    const petals = [0, 72, 144, 216, 288].map(a => `<path d="${PETALA}" transform="rotate(${a})"/>`).join("");
    g += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${Math.floor(r() * 72)}) scale(${s.toFixed(2)})" fill="#070707" stroke="#d8d8d8" stroke-opacity=".55" stroke-width="5">${petals}</g>`;
  }
  document.getElementById("galho").innerHTML = g;
</script>
</body></html>
