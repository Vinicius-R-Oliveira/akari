<!doctype html>
<html><head><meta charset="utf-8">
<!-- Akari · 桜の木 Sakura no Ki — uma cerejeira grande ao entardecer, balançando e soltando pétalas (vídeo em loop) -->
<style>
  @font-face{font-family:"Fraktur";src:url("../../fonts/UnifrakturCook-Bold.woff2");font-weight:700}
  html,body{margin:0;width:1920px;height:1080px;background:#1c0d1a;overflow:hidden}
  .layer{position:absolute;inset:0}
  #word{position:absolute;left:150px;bottom:150px;font-family:"Fraktur";font-weight:700;font-size:150px;color:#fde4ec;
        text-shadow:0 0 40px rgba(255,170,200,.45)}
  #sub{position:absolute;left:156px;bottom:118px;font-family:"DejaVu Sans Mono";font-size:12px;letter-spacing:.45em;color:rgba(255,220,232,.6)}
  #kanji{position:absolute;left:170px;top:130px;writing-mode:vertical-rl;font-family:"Noto Serif CJK JP";font-weight:300;font-size:96px;letter-spacing:.3em;
         color:rgba(255,228,236,.85);text-shadow:0 0 24px rgba(255,170,200,.35)}
  #haiku{position:absolute;left:300px;top:140px;writing-mode:vertical-rl;font-family:"Noto Serif CJK JP";font-size:19px;letter-spacing:.55em;color:rgba(255,220,232,.5)}
  .copa{transform-box:view-box;transform-origin:1240px 1000px;animation:balanca2 ease-in-out infinite alternate}
  @keyframes balanca2{from{transform:rotate(-.45deg)}to{transform:rotate(.45deg)}}
  .brilha{animation:respira ease-in-out infinite}
</style>
<script src="comum.js"></script>
<script src="sakura.js"></script>
</head>
<body>
<svg class="layer" width="1920" height="1080">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0c1d"/><stop offset=".38" stop-color="#4a1d3d"/><stop offset=".68" stop-color="#a8486d"/><stop offset=".86" stop-color="#ee9eae"/><stop offset="1" stop-color="#f7c9c4"/>
    </linearGradient>
    <radialGradient id="sol" cx="1240" cy="880" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe6dc" stop-opacity=".9"/><stop offset=".25" stop-color="#ffc4c8" stop-opacity=".45"/><stop offset="1" stop-color="#ff9fb5" stop-opacity="0"/></radialGradient>
    <linearGradient id="morro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1022"/><stop offset="1" stop-color="#12060f"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ceu)"/>
  <rect width="1920" height="1080" fill="url(#sol)"/>
  <path d="M0 860 C300 820 520 860 760 840 C980 820 1200 860 1500 830 C1700 812 1840 830 1920 840 V1080 H0 Z" fill="#5b2440" opacity=".55"/>
  <path d="M0 950 C260 905 560 930 900 925 C1180 920 1420 890 1920 930 V1080 H0 Z" fill="url(#morro)"/>
</svg>
<div id="atras" class="layer"></div>
<svg id="arvore" class="layer" width="1920" height="1080"></svg>
<div id="kanji">桜の木</div>
<div id="haiku">花の雲　鐘は上野か　浅草か</div>
<div id="word">akari</div>
<div id="sub">SAKURA NO KI · 桜の木 · AKR—014</div>
<div id="frente" class="layer"></div>
<svg class="layer" width="1920" height="1080" style="pointer-events:none"><rect x="60" y="48" width="1800" height="984" rx="20" fill="none" stroke="#ffe0ea" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="13 9"/></svg>
<svg class="layer" width="1920" height="1080" style="mix-blend-mode:screen;opacity:.06">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="1920" height="1080" filter="url(#n)"/>
</svg>
<svg class="layer" width="1920" height="1080"><defs><radialGradient id="vig" cx="60%" cy="50%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#vig)"/></svg>
<script>
  const r = semente(22);
  const galhos = [], pontas = [];
  // Árvore recursiva: larga e baixa, como as cerejeiras de parque
  function ramo(x, y, ang, len, larg, prof) {
    const curva = (r() - .5) * 0.5;
    const a1 = ang + curva;
    const x1 = x + Math.cos(a1) * len, y1 = y + Math.sin(a1) * len;
    const cx = x + Math.cos(ang - curva) * len * .5, cy = y + Math.sin(ang - curva) * len * .5;
    galhos.push({ d: `M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`, larg, prof });
    if (prof >= 6 || larg < 2.2) { pontas.push([x1, y1, prof]); return; }
    if (prof >= 3) pontas.push([(x + x1) / 2, (y + y1) / 2, prof]);
    const filhos = prof === 0 ? 3 : prof < 2 ? 2 : (r() < .35 ? 3 : 2);
    for (let i = 0; i < filhos; i++) {
      const abre = prof === 0 ? 0.75 : prof < 3 ? 0.68 : 0.5;
      let na = a1 + (i - (filhos - 1) / 2) * abre * (0.8 + r() * 0.5) + (r() - .5) * .2;
      // puxa os galhos para os lados (copa larga)
      na = na * 0.8 + (na < -Math.PI / 2 ? -Math.PI * 0.97 : -0.03) * 0.2;
      ramo(x1, y1, na, len * (prof === 0 ? 1.0 : 0.76 + r() * 0.1), larg * (prof === 0 ? 0.58 : 0.68), prof + 1);
    }
  }
  ramo(1240, 1000, -Math.PI / 2 - 0.04, 175, 84, 0);

  // Copa: nuvens de flores em 3 camadas (fundo escuro, meio, frente clara)
  const tons = [["#b8537a", "#c9628a", "#a9466e"], ["#ee9ab4", "#f4adc2", "#e78aa8"], ["#fcd9e3", "#f9c6d5", "#ffe9ef"]];
  function copa(camada) {
    let s = "";
    for (const [x, y, prof] of pontas) {
      const n = camada === 0 ? 7 : camada === 1 ? 10 : 5;
      for (let i = 0; i < n; i++) {
        const rr = (camada === 0 ? 40 : camada === 1 ? 24 : 13) * (0.55 + r() * 0.8);
        const ox = (r() - .5) * 150, oy = (r() - .5) * 100 - (camada === 2 ? 14 : 0);
        const c = tons[camada][Math.floor(r() * 3)];
        s += `<circle cx="${(x + ox).toFixed(0)}" cy="${(y + oy).toFixed(0)}" r="${rr.toFixed(0)}" fill="${c}" fill-opacity="${(camada === 2 ? .75 : .85).toFixed(2)}"/>`;
      }
    }
    return s;
  }
  let svg = sakuraDefs("sk") + `<defs><filter id="suave"><feGaussianBlur stdDeviation="5"/></filter><filter id="suave2"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="luzCopa" cx="1240" cy="420" r="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  // sombra de pétalas no chão
  let chao = "";
  for (let i = 0; i < 260; i++) {
    const x = 1240 + (r() - .5) * 1500 * Math.sqrt(r()), y = 960 + r() * 110;
    chao += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(3 + r() * 5).toFixed(1)}" ry="${(1.5 + r() * 2).toFixed(1)}" fill="${tons[1 + Math.floor(r() * 2)][Math.floor(r() * 3)]}" fill-opacity="${(.4 + r() * .5).toFixed(2)}"/>`;
  }
  svg += `<ellipse cx="1240" cy="1010" rx="760" ry="40" fill="#e88aa8" fill-opacity=".18" filter="url(#suave)"/>` + chao
    + `<path d="M1170 1010 C1200 990 1205 960 1200 930 L1282 930 C1276 962 1282 992 1318 1012 Z" fill="#24101a"/>`;
  // tronco e galhos (mais grossos primeiro)
  const tronco = galhos.map(g => `<path d="${g.d}" fill="none" stroke="#24101a" stroke-width="${g.larg.toFixed(1)}" stroke-linecap="round"/>`).join("");
  const luzTronco = galhos.filter(g => g.larg > 6).map(g => `<path d="${g.d}" fill="none" stroke="#ffb7c9" stroke-opacity=".18" stroke-width="${(g.larg * .18).toFixed(1)}" stroke-linecap="round" transform="translate(${(g.larg * .25).toFixed(1)} 0)"/>`).join("");
  svg += `<g class="copa" style="animation-duration:${LOOP / 2}s;animation-delay:-2s">
    <g filter="url(#suave)">${copa(0)}</g>${tronco}${luzTronco}
    <g filter="url(#suave2)">${copa(1)}</g></g>`;
  // camada da frente com flores de verdade nas bordas, balançando um pouco atrasada
  let flores = "";
  pontas.filter(() => r() < .45).forEach(([x, y]) => {
    flores += sakuraFlor(x + (r() - .5) * 120, y + (r() - .5) * 90, .32 + r() * .3, r() * 72, r);
  });
  svg += `<g class="copa" style="animation-duration:${LOOP / 2}s;animation-delay:-2.6s">${copa(2)}${flores}<circle cx="1240" cy="420" r="700" fill="url(#luzCopa)"/></g>`;
  // escala a árvore inteira (a partir da base do tronco) para caber ao lado do texto
  document.getElementById("arvore").innerHTML = `<g transform="translate(1290 1000) scale(.84) translate(-1240 -1000)">${svg}</g>`;
  // pétalas: poucas atrás, muitas na frente, vento leve para a esquerda
  petalasRosa(document.getElementById("atras"), 26, { seed: 8, dx: -700, dy: 1100, tamMin: 8, tamMax: 16 });
  petalasRosa(document.getElementById("frente"), 64, { seed: 33, dx: -900, dy: 1250, tamMin: 14, tamMax: 36 });
</script>
</body></html>
