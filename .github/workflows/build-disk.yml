---
name: Akari · gerar ISO e imagem de VM

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: akari # igual ao IMAGE_NAME do akari.env
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # ubuntu-24.04: no 26.04 o perfil AppArmor do bubblewrap impede o osbuild de montar /dev
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Liberar o bubblewrap para o osbuild (AppArmor)
        run: |
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Apontar o instalador para a sua imagem
        run: |
          sed -i "s|__AKARI_IMAGE__|${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}|g" ./disk_config/iso.toml
          cat ./disk_config/iso.toml

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs btrfs

      # A ISO vira um Release com links fixos (o artifact de 5 GB expira e não retoma).
      # O GitHub limita cada arquivo de Release a 2 GB, então ela vai em partes.
      - name: Publicar a ISO como Release (em partes)
        if: matrix.disk-type == 'anaconda-iso' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.output-directory }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISO="$(find "${OUT}" -name '*.iso' | head -n1)"
          echo "ISO: ${ISO}"
          mkdir -p release
          cd release
          split -b 1900M -d -a 3 --numeric-suffixes=1 "${ISO}" akari-install.iso.
          (cd "$(dirname "${ISO}")" && sha256sum "$(basename "${ISO}")") | awk '{print $1"  akari-install.iso"}' > akari-install.iso.sha256
          parts="$(ls akari-install.iso.0* | tr '\n' ' ' | sed 's/ $//; s/ / + /g')"
          printf '@echo off\r\necho Juntando as partes da ISO da Akari...\r\ncopy /b %s akari-install.iso\r\necho Pronto: akari-install.iso\r\npause\r\n' "${parts}" > juntar-iso-windows.bat
          printf '#!/bin/sh\ncat akari-install.iso.0* > akari-install.iso && sha256sum -c akari-install.iso.sha256\n' > juntar-iso-linux.sh
          ls -la
          TAG=iso-latest
          if ! gh release view "${TAG}" -R "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" -R "${REPO}" --title "Akari · ISO de instalação" \
              --notes "Baixe TODAS as partes akari-install.iso.0XX e o arquivo juntar-iso. No Windows, deixe tudo na mesma pasta e dê dois cliques em juntar-iso-windows.bat. No Linux: sh juntar-iso-linux.sh. O resultado é o akari-install.iso."
          fi
          for old in $(gh release view "${TAG}" -R "${REPO}" --json assets -q '.assets[].name'); do
            gh release delete-asset "${TAG}" "${old}" -R "${REPO}" -y
          done
          gh release upload "${TAG}" -R "${REPO}" ./*

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akari-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
