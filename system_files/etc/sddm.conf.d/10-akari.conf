# Genkan 玄関 — tela de login da Akari
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_DISABLE_WINDOWDECORATION=1,QT_QUICK_CONTROLS_STYLE=Basic
InputMethod=
Numlock=none

[Wayland]
CompositorCommand=/usr/libexec/akari/genkan-compositor

[Theme]
Current=genkan
CursorTheme=Bibata-Modern-Ice
CursorSize=24
Font=Google Sans Flex,11

[Users]
RememberLastUser=true
RememberLastSession=true
