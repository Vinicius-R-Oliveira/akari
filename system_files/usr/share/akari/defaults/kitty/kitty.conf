# kitty — configuração padrão da Akari (pode editar à vontade)

# Shell: fish com o prompt do Caelestia (starship) e o fastfetch com a flor
shell fish

font_family      JetBrainsMono Nerd Font
font_size        11.5
disable_ligatures never

# Cores seguem o wallpaper (geradas pelo Caelestia)
include ~/.local/state/caelestia/theme/kitty-colors.conf

# Visual do vídeo: fundo translúcido com o blur do Hyprland por trás
background_opacity 0.82
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
tab_bar_style powerline
tab_powerline_style round

# Atalhos úteis
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
