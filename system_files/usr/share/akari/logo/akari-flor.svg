<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <title>Akari — logo</title>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paper" cx="0" cy="0" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".3" stop-color="#f2f2f2" stop-opacity=".3"/>
      <stop offset=".7" stop-color="#bdbdbd" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity=".04"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".7" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d9d9d9"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="bloomBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  
    <g transform="translate(100 102)">
      <circle class="halo" r="98" fill="url(#halo)"/>
      <g class="glowfill" opacity="1">
      <path class="fill p0" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(0)" fill="url(#paper)" stroke="none" stroke-width="0" stroke-linejoin="round" />
      <path class="fill p1" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(72)" fill="url(#paper)" stroke="none" stroke-width="0" stroke-linejoin="round" />
      <path class="fill p2" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(144)" fill="url(#paper)" stroke="none" stroke-width="0" stroke-linejoin="round" />
      <path class="fill p3" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(216)" fill="url(#paper)" stroke="none" stroke-width="0" stroke-linejoin="round" />
      <path class="fill p4" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(288)" fill="url(#paper)" stroke="none" stroke-width="0" stroke-linejoin="round" />
      </g>
      <g class="bloom" filter="url(#bloom)" opacity=".6">
      <path class="bl p0" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(0)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      <path class="bl p1" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(72)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      <path class="bl p2" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(144)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      <path class="bl p3" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(216)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      <path class="bl p4" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(288)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      </g>
      <g class="lines">
      <path class="ol p0" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(0)" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" pathLength="1"/>
      <path class="ol p1" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(72)" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" pathLength="1"/>
      <path class="ol p2" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(144)" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" pathLength="1"/>
      <path class="ol p3" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(216)" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" pathLength="1"/>
      <path class="ol p4" d="M0 -14 C-20 -30 -26 -58 -12 -76 L0 -66 L12 -76 C26 -58 20 -30 0 -14 Z" transform="rotate(288)" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" pathLength="1"/>
      </g>
      <circle class="corehalo" r="26" fill="#fff" opacity=".55" filter="url(#bloomBig)"/>
      <circle class="core" r="10" fill="url(#core)"/>
    </g>
</svg>
